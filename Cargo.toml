[workspace]
members = [".", "fake-ssh"]
default-members = [".", "fake-ssh"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[package]
name = "sshtm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
nix = { version = "0.31", features = ["fs", "process", "signal", "socket", "user"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "process", "net", "signal", "time", "macros", "io-util", "sync"] }

[dev-dependencies]
assert_cmd = "2.2"
tempfile = "3.27"
